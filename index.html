<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title and Description -->
  <title>%VITE_APP_TITLE%</title>
  <meta name="description"
    content="%VITE_APP_DESCRIPTION%">
  <meta name="keywords" content="%VITE_APP_KEYWORDS%">
  <meta name="author" content="%VITE_APP_AUTHOR%">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Theme Color -->
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="%VITE_APP_TITLE%">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="%VITE_APP_URL%">
  <meta property="og:title" content="%VITE_APP_TITLE%">
  <meta property="og:description"
    content="%VITE_APP_DESCRIPTION%">
  <meta property="og:image" content="/assets/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="pt_BR">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="%VITE_APP_URL%">
  <meta property="twitter:title" content="%VITE_APP_TITLE%">
  <meta property="twitter:description"
    content="%VITE_APP_DESCRIPTION%">
  <meta property="twitter:image" content="/assets/icons/og-image.png">

  <!-- Schema.org Structured Data for SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ArchitectureFirm",
    "name": "%VITE_APP_TITLE%",
    "description": "%VITE_APP_DESCRIPTION%",
    "url": "%VITE_APP_URL%",
    "logo": "%VITE_APP_URL%/assets/icons/icon-512x512.png",
    "image": "%VITE_APP_URL%/assets/icons/og-image.png",
    "priceRange": "",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "BR",
      "addressLocality": "Brasil"
    },
    "sameAs": [
      "%VITE_APP_SOCIAL_INSTAGRAM%",
      "%VITE_APP_SOCIAL_LINKEDIN%"
    ],
    "knowsAbout": [
      "Arquitetura",
      "Design de Interiores",
      "Projetos Residenciais",
      "Projetos Comerciais"
    ],
    "makesOffer": {
      "@type": "Offer",
      "itemOffered": {
        "@type": "Service",
        "name": "Serviços de Arquitetura e Design",
        "description": "Projetos arquitetônicos completos, design de interiores, acompanhamento de obra e consultoria."
      }
    }
  }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet">

  <!-- Note: Vite handles all module imports automatically via bundling -->
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
